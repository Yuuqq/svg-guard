<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" xmlns:xlink="http://www.w3.org/1999/xlink">
  <!-- Outer frame contains the label's center once the label leaves the
       inner card. The inner card is the container the author meant. -->
  <rect x="20" y="20" width="360" height="160" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="40" y="50" width="100" height="50" fill="#fee2e2"/>
  <text x="48" y="80" font-family="sans-serif" font-size="16" fill="#111">inner card title that overflows</text>
</svg>
