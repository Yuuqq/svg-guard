<svg viewBox="0 0 400 200" width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- A rect carrying a rotate() transform, with text that overflows it.
       Editing the rect width/height would NOT grow the rendered box by the
       measured amount, because width/height live in the local space before
       the transform is applied. The checker must flag this rect as
       transformed and the fixer must SKIP it rather than write a wrong width. -->
  <rect x="100" y="60" width="120" height="80" fill="#e0e7ff" stroke="#6366f1"
        transform="rotate(45 160 100)"/>
  <text x="160" y="100" text-anchor="middle" font-family="sans-serif"
        font-size="18" fill="#312e81">rotated card overflowing label text</text>
</svg>
