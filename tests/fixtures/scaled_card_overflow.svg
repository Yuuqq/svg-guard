<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240">
  <!-- scale() is not a translation: writing the measured user-space delta
       into width would overshoot. Must stay unfixable. -->
  <g transform="scale(1.5)">
    <rect x="20" y="20" width="80" height="40" fill="#fee2e2"/>
    <text x="28" y="46" font-family="sans-serif" font-size="16" fill="#111">scaled label that is wider than the card</text>
  </g>
</svg>
